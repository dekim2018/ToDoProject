services:
  mysql:
    image: mysql:8.4
    container_name: todo-project-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_project
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - todo-project-mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: todo-project-app
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/todo_project?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  todo-project-mysql-data: